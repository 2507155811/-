name: Downloadable Windows and Android packages
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Release (requires repository release permission)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/packages.yml
      - src.js
      - dinosaur.js
      - evolution.js
      - evolution.css
      - desktop/**
      - native-ui.js
      - native.css
      - local-ai.js
      - android/app/src/**
      - companion-data.js
      - companion-features.js
      - public/evolution/**
      - scripts/prepare-windows-engine.mjs
      - scripts/prepare-llama.mjs
permissions:
  contents: read
concurrency:
  group: momo-packages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        if: matrix.target == 'android'
        run: |
          # GitHub's Ubuntu runner already has the official Android SDK.
          # Avoid reinstalling command-line tools through a third-party action.
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Download and verify bundled AI model
        run: npm run ai:model
      - name: Package Windows x64
        if: matrix.target == 'windows'
        run: |
          npm run desktop:package:windows 2>&1 | tee build-windows.log
          npm run test:ai
          python - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('artifacts/desktop/MOMO-win32-x64')
          pathlib.Path('release').mkdir(exist_ok=True)
          with zipfile.ZipFile('release/MOMO-Windows-x64-with-AI.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in root.rglob('*'):
                  if f.is_file(): z.write(f, pathlib.Path('MOMO-Windows-x64')/f.relative_to(root))
          PY
      - name: Package Android arm64
        if: matrix.target == 'android'
        run: |
          chmod +x android/gradlew
          npm run android:build 2>&1 | tee build-android.log
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/momo-0.6-with-ai-debug.apk
      - name: Verify packaged Windows engine
        if: matrix.target == 'windows'
        run: |
          node scripts/test-packaged-engine.mjs
      - name: Report build failure details
        if: failure()
        run: |
          python - <<'PY'
          import pathlib, re
          for file in pathlib.Path('.').glob('build-*.log'):
              lines=file.read_text(errors='replace').splitlines()
              errors=[line for line in lines if re.search(r'error[: ]|failed|exception|assertion',line,re.I)]
              for line in (errors[-12:] or lines[-8:]):
                  print('::error::'+line[-1200:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: momo-${{ matrix.target }}
          path: release/*
          compression-level: 0
          retention-days: 14
      - name: Show installation download link
        run: |
          echo '## Installation download' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download ${{ matrix.target }} package](${{ steps.upload.outputs.artifact-url }}) (sign in to GitHub; extract the downloaded archive)' >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish installation downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: momo-0.6-build-${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release/* --target "$SOURCE_SHA" --title 'MOMO 0.6 · Windows 与安卓（内置 AI）' --notes 'Windows：完整解压 ZIP 后运行 MOMO.exe；缺少 VC++ 运行库时安装 https://aka.ms/vs/17/release/vc_redist.x64.exe 。安卓：适用于 ARM64 的调试版 APK。两端均内置 Qwen2.5-0.5B Q4_K_M 离线模型。更换宠物形象不会删除记忆。尚未完成 Windows 和安卓实机验证；不包含活动任务自动化。' --latest
