name: Publish existing installation packages
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful package build run ID
        default: '38841265790'
        required: true
  push:
    branches: [main]
    paths: [.github/workflows/publish-existing.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || '38841265790' }}
          path: release
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: momo-0.5-build-${{ inputs.build_run || '38841265790' }}
        run: |
          set +e
          gh release create "$RELEASE_TAG" release/* --target d79079c807cd3cfe0a20ca0c0b7d3e4ea11e5c46 --title 'MOMO 0.5 · Windows 与安卓（内置 AI）' --notes 'Windows：完整解压 ZIP 后运行 MOMO.exe。安卓：ARM64 调试版 APK。两个版本均内置 Qwen2.5-0.5B 离线模型。更换外观保留记忆。模型按需加载，空闲后卸载。尚未完成实机验证。' --latest > publish.log 2>&1
          result=$?
          cat publish.log
          if [ "$result" -ne 0 ]; then
            python - <<'PY'
          import pathlib
          for line in pathlib.Path('publish.log').read_text().splitlines()[-12:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$result"
